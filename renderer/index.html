<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';" />
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <!-- Empty space around the pet is the drag handle (-webkit-app-region: drag).
         Interactive bits opt out with .no-drag. -->
    <main id="stage">
      <!-- "Forgot auto-mode?" nudge — lives in the space the window grows to
           Rocky's LEFT, so it is NOT inside #base (which shifts to stay put). -->
      <div id="autoNudge" class="auto-nudge hidden" aria-hidden="true">
        <button id="autoNudgeBody" class="auto-nudge-body no-drag" type="button">
          switch to auto mode →
        </button>
        <button id="autoNudgeClose" class="auto-nudge-close no-drag" type="button" title="dismiss">×</button>
      </div>

      <!-- Everything anchored to Rocky's base rect. Offset by --shift-x so it
           stays pinned on screen when the window grows leftward. -->
      <div id="base">
        <div id="bubble" class="bubble" aria-hidden="true"></div>

        <div id="sessions" class="sessions"></div>

        <div id="rocky" class="rocky no-drag" title="click Rocky!">
          <canvas id="still" class="layer" width="93" height="93"></canvas>
          <img id="anim" class="layer hidden" alt="Rocky" draggable="false" />
        </div>

        <button id="quit" class="quit no-drag" title="bye Rocky">×</button>
      </div>
    </main>

    <script src="ball.js"></script>
    <script src="hats.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
